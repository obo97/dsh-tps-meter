name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # 零依赖：不需要 install，直接跑测试
      - name: Unit tests (tracker)
        run: node --test test/tracker.test.mjs
      - name: Host plugin smoke tests
        run: node --test test/host.test.mjs
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/tracker.js
          node --check lib/widget.js
